name: Flatpak 26.08 source builds
on:
  push:
    branches: [test/flatpak-26-08]
    paths: [native-source/**, .github/workflows/flatpak-source-validation.yml]
permissions:
  contents: read
jobs:
  source:
    name: ${{ matrix.app }} source ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: [{"app":"pdfcraft","arch":"x86_64","runner":"ubuntu-24.04","url":"https://github.com/storytold/pdfcraft/releases/download/v0.14.0/pdfcraft-0.14.0-linux-x86_64.tar.gz","sha256":"a93f511e87f63036ca5f5300b1a7a18a3cd2285205deab15394caa6ee83c6f1f","source_ref":"64e0868b844e0230027a493c90d6e4bdc7af086f"},{"app":"pdfcraft","arch":"aarch64","runner":"ubuntu-24.04-arm","url":"https://github.com/storytold/pdfcraft/releases/download/v0.14.0/pdfcraft-0.14.0-linux-aarch64.tar.gz","sha256":"fe6711b5e211bc01405f3dad799f252f4e1b2cc976b7c47f83fe7a97cebe9838","source_ref":"64e0868b844e0230027a493c90d6e4bdc7af086f"},{"app":"gridcraft","arch":"x86_64","runner":"ubuntu-24.04","url":"https://github.com/storytold/gridcraft/releases/download/v0.12.1/gridcraft-0.12.1-linux-x86_64.tar.gz","sha256":"1c1750dd6d26376cf8c8af22b46dc0ed3d8d5cbb115e555f0fc7d0cf7a9aea9a","source_ref":"d8c5f5885fc5320f8f1023d5fdc9f484a185ba86"},{"app":"gridcraft","arch":"aarch64","runner":"ubuntu-24.04-arm","url":"https://github.com/storytold/gridcraft/releases/download/v0.12.1/gridcraft-0.12.1-linux-aarch64.tar.gz","sha256":"65465f9077fa1490bc6835515ed7dfbc562b5dfe417493c6c1c07838b149ffab","source_ref":"d8c5f5885fc5320f8f1023d5fdc9f484a185ba86"},{"app":"wordcraft","arch":"x86_64","runner":"ubuntu-24.04","url":"https://github.com/storytold/wordcraft/releases/download/v0.11.0/wordcraft-0.11.0-linux-x86_64.tar.gz","sha256":"034c247bf6dab172a2edfb0767de9065125b857826c6915f7ef39b9f43951d5a","source_ref":"6a2b520fa49aa0d0595cea36589aaf16ca371cd3"},{"app":"wordcraft","arch":"aarch64","runner":"ubuntu-24.04-arm","url":"https://github.com/storytold/wordcraft/releases/download/v0.11.0/wordcraft-0.11.0-linux-aarch64.tar.gz","sha256":"a373495928e81be5184a8a94e55db1ed14a3ad1e61b4a13f473d20255f391fc6","source_ref":"6a2b520fa49aa0d0595cea36589aaf16ca371cd3"},{"app":"deckcraft","arch":"x86_64","runner":"ubuntu-24.04","url":"https://github.com/storytold/deckcraft/releases/download/v0.11.1/deckcraft-0.11.1-linux-x86_64.tar.gz","sha256":"7bf57a10a4fcf7673ecb669b64e0e545475780ef3e4ee6bf603aeb00f544e69c","source_ref":"aaf6c1c38aa6c59beda8110bd014cc6c96c6ec74"},{"app":"deckcraft","arch":"aarch64","runner":"ubuntu-24.04-arm","url":"https://github.com/storytold/deckcraft/releases/download/v0.11.1/deckcraft-0.11.1-linux-aarch64.tar.gz","sha256":"16c6a05587aca978a9a75569f19ca60ceaf94215fa42219a8d2781e356c8b865","source_ref":"aaf6c1c38aa6c59beda8110bd014cc6c96c6ec74"}]
    env:
      APP: ${{ matrix.app }}
      SOURCE_REF: ${{ matrix.source_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common elfutils python3-venv
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Fetch the exact source checkout and changed manifest
        run: |
          git init source
          git -C source remote add origin "https://github.com/storytold/$APP.git"
          git -C source fetch --depth=1 origin "$SOURCE_REF"
          git -C source checkout FETCH_HEAD
          cp "native-source/ai.storyteller.$APP.yml" "source/packaging/linux/flatpak/ai.storyteller.$APP.yml"
          sha256sum "source/packaging/linux/flatpak/ai.storyteller.$APP.yml" source/Cargo.lock
      - name: Generate the documented offline Cargo sources
        run: |
          git init generator
          git -C generator fetch --depth=1 https://github.com/flatpak/flatpak-builder-tools.git 9d86d336a39b9af38b86f114b6ce5820fe260f91
          git -C generator checkout FETCH_HEAD
          python3 -m venv generator-env
          generator-env/bin/pip install 'aiohttp>=3.9.5,<4' 'tomlkit>=0.13.3,<1'
          generator-env/bin/pip freeze
          cd source
          ../generator-env/bin/python ../native-source/generate-cargo-sources.py --generator ../generator/cargo/flatpak-cargo-generator.py Cargo.lock -o "packaging/linux/flatpak/cargo-sources.json"
      - name: Build the changed source manifest offline under SDK 26.08
        run: |
          flatpak-builder --user --install-deps-from=flathub --assumeyes --disable-rofiles-fuse --force-clean --jobs=2 --repo=source-repo --state-dir=source-state source-build "source/packaging/linux/flatpak/ai.storyteller.$APP.yml"
          cat source-build/metadata
          grep -Fx "runtime=org.freedesktop.Platform/${{ matrix.arch }}/26.08" source-build/metadata
          grep -Fx "sdk=org.freedesktop.Sdk/${{ matrix.arch }}/26.08" source-build/metadata
          test -x "source-build/files/bin/$APP"
